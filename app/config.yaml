# 모든 조정값을 이 파일에 모은다. 코드에는 숫자를 직접 넣지 않는다.
# 경로는 프로젝트 루트 기준 상대 경로.

project:
  name: can-i-run-this
  version: "0.1.0"

paths:
  models_json: data/models.json
  hw_specs_csv: data/hw_specs.csv
  offline_docs_dir: data/offline_docs
  chroma_dir: data/chroma
  cache_dir: data/cache
  log_file: logs/app.log

# LLM / 임베딩 (SSAFY GMS, OpenAI 호환). 키와 주소는 .env에서 읽는다.
# TODO(확인 필요): GMS에서 실제로 제공하는 모델명으로 맞출 것
llm:
  chat_model: gpt-4o-mini
  embedding_model: text-embedding-3-small
  temperature: 0.0
  request_timeout_s: 60
  max_retries: 2

# 데이터 수집 (F2001)
fetch_models:
  pipeline_tag: text-generation
  sort: downloads
  target_count: 150          # 명세 조건: 약 100건 이상

# 외부 문서 수집 (F2003~F2004)
collect:
  offline_mode: false        # true면 data/offline_docs/ 묶음으로 수집을 대신한다
  max_queries: 5             # 프롬프트 1이 뽑는 검색어 최대 개수
  candidates_per_query: 5    # 출처별 후보 수
  max_selected_docs: 6       # 프롬프트 2가 고를 수 있는 최대 문서 수 (모델 카드는 별도로 항상 포함)
  wikipedia_langs: [ko, en]  # 한국어 우선, 없으면 영어
  max_doc_chars: 60000       # 본문이 너무 긴 문서는 앞부분만 사용 (선택 모델의 모델 카드는 예외)

# 외부 API 공통 규칙 (NF2006)
http:
  timeout_s: 20
  max_retries: 3
  backoff_factor: 1.0        # 재시도 대기: 1s, 2s, 4s ...
  retry_statuses: [429, 500, 502, 503, 504]
  min_interval_s:            # 호스트별 최소 호출 간격 (초)
    default: 0.5
    huggingface.co: 0.2
    ko.wikipedia.org: 0.5
    en.wikipedia.org: 0.5
    export.arxiv.org: 3.0    # arXiv API 이용 규칙: 3초에 1회
    arxiv.org: 3.0

# 청킹 (F2005)
chunking:
  chunk_size: 1000
  chunk_overlap: 200
  markdown_header_split: true  # 모델 카드는 헤더 단위로 먼저 나눈 뒤 크기 분할

# 검색 (F2006, F2014)
retrieval:
  top_k: 5                   # model_docs에서 가져올 청크 수 (메타데이터 1건은 별도로 항상 포함)
  concept_top_k: 2           # 위키백과 등 개념 문서(모델 필터 없음)에서 가져올 청크 수
  search_type: similarity    # similarity | mmr
  mmr_fetch_k: 30
  mmr_lambda: 0.5

# 하드웨어 판정 / 속도 추정 (F2010)
hardware:
  apple_gpu_mem_ratio: 0.7   # 통합 메모리 중 GPU가 쓸 수 있다고 보는 비율 (가정값, 조정 가능)
  overhead_ratio: 0.10       # 가중치+KV 캐시 외 런타임 오버헤드 비율 (가정값, Phase 6에서 검토)
  speed_efficiency: 0.6      # 실효 대역폭 / 이론 대역폭 (가정값, 실측으로 보정 예정)
  default_context: 4096      # 판정에 쓸 기본 컨텍스트 길이
  kv_cache_bytes: 2          # KV 캐시 원소당 바이트 (FP16)

# 양자화별 가중치당 비트 수 (bits per weight)
# 출처: llama.cpp k-quants 설명 (ggml-org/llama.cpp PR #1684), ggml 블록 구조 정의
#   Q8_0 = 32개 int8 + fp16 scale = 34바이트/32가중치 = 8.5 bpw
#   Q4_K = 4.5 bpw, Q5_K = 5.5 bpw, Q6_K = 6.5625 bpw (PR #1684 본문)
# Q4_K_M / Q5_K_M은 일부 텐서를 더 높은 비트로 두는 혼합 방식이라 실제 bpw가 기본값보다 크다.
# TODO(보정 필요): 실제 GGUF 파일 크기 ÷ 파라미터 수로 실효 bpw를 측정해 갱신할 것
quantization:
  Q4_K_M: 4.5
  Q5_K_M: 5.5
  Q6_K: 6.5625
  Q8_0: 8.5
  FP16: 16
