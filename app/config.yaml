# 모든 조정값을 이 파일에 모은다. 코드에는 숫자를 직접 넣지 않는다.
# 경로는 프로젝트 루트 기준 상대 경로.

project:
  name: can-i-run-this
  version: "0.1.0"

paths:
  models_json: data/models.json
  hw_specs_csv: data/hw_specs.csv
  offline_docs_dir: data/offline_docs
  chroma_dir: data/chroma
  cache_dir: data/cache
  log_file: logs/app.log

# LLM / 임베딩 (SSAFY GMS, OpenAI 호환). 키와 주소는 .env에서 읽는다.
# TODO(확인 필요): GMS에서 실제로 제공하는 모델명으로 맞출 것
llm:
  chat_model: gpt-4o-mini
  embedding_model: text-embedding-3-small
  temperature: 0.0
  request_timeout_s: 60
  max_retries: 2

# 데이터 수집 (F2001)
fetch_models:
  pipeline_tag: text-generation
  sort: downloads
  target_count: 150          # 명세 조건: 약 100건 이상

# 외부 문서 수집 (F2003~F2004)
collect:
  offline_mode: false        # true면 data/offline_docs/ 묶음으로 수집을 대신한다
  max_queries: 5             # 프롬프트 1이 뽑는 검색어 최대 개수
  candidates_per_query: 5    # 출처별 후보 수
  max_selected_docs: 6       # 프롬프트 2가 고를 수 있는 최대 문서 수 (모델 카드는 별도로 항상 포함)
  wikipedia_langs: [ko, en]  # 한국어 우선, 없으면 영어
  max_pdf_pages: 40          # arXiv PDF에서 읽을 최대 쪽 수 (기술 보고서 본문 + 표, 부록은 대개 뒤쪽)
  max_doc_chars: 60000       # 본문이 너무 긴 문서는 앞부분만 사용 (선택 모델의 모델 카드는 예외)

# 외부 API 공통 규칙 (NF2006)
http:
  timeout_s: 20
  max_retries: 3
  backoff_factor: 1.0        # 재시도 대기: 1s, 2s, 4s ...
  max_retry_after_s: 10      # 서버가 이보다 오래 기다리라고 하면(Retry-After) 재시도하지 않는다
  retry_statuses: [429, 500, 502, 503, 504]
  min_interval_s:            # 호스트별 최소 호출 간격 (초)
    default: 0.5
    huggingface.co: 0.2
    ko.wikipedia.org: 1.0
    en.wikipedia.org: 1.0
    export.arxiv.org: 3.0    # arXiv API 이용 규칙: 3초에 1회 (https만 허용)
    arxiv.org: 3.0

# 청킹 (F2005)
chunking:
  chunk_size: 1000
  chunk_overlap: 200
  markdown_header_split: true  # 모델 카드는 헤더 단위로 먼저 나눈 뒤 크기 분할

# 검색 (F2006, F2014)
retrieval:
  top_k: 5                   # model_docs에서 가져올 청크 수 (메타데이터 1건은 별도로 항상 포함)
  concept_top_k: 2           # 위키백과 등 개념 문서(모델 필터 없음)에서 가져올 청크 수. 개념 검색어가 있을 때만 검색
  license_top_k: 3          # 라이선스 질문이면 라이선스 원문에서 따로 가져올 청크 수 (한국어 질문과 영어 원문은 임베딩 거리가 멀다)
  overfetch: 3               # 중복 제거로 빠질 몫까지 top_k × overfetch개를 먼저 가져온다
  near_dup_threshold: 0.8    # 본문 단어 3-gram 자카드 유사도가 이 이상이면 같은 내용으로 보고 뒤의 것을 버린다
  # similarity | mmr. MMR이 기본: docs/eval/mmr_comparison.md에서 4개 질문 모두 근거 간 평균 유사도가 가장 낮았고,
  # 기술 보고서 PDF 청크가 늘자 similarity는 공식 카드의 샘플링 설정 청크를 놓쳐 오답을 냈지만 MMR은 찾았다.
  search_type: mmr
  mmr_fetch_k: 30
  mmr_lambda: 0.5

# 조건 기반 모델 탐색 (F2011)
recommend:
  candidate_k: 30            # model_meta 의미 검색 후보 수 (언어 조건이 있으면 본문 필터 검색 결과를 더한다)
  max_results: 6             # 카드로 보여 줄 최대 모델 수

# 하드웨어 판정 / 속도 추정 (F2010)
hardware:
  apple_gpu_mem_ratio: 0.7   # 통합 메모리 중 GPU가 쓸 수 있다고 보는 비율 (가정값, 조정 가능)
  overhead_ratio: 0.10       # 가중치+KV 캐시 외 런타임 오버헤드 비율 (가정값, Phase 6에서 검토)
  speed_efficiency: 0.6      # 실효 대역폭 / 이론 대역폭 (가정값, 실측으로 보정 예정)
  default_context: 4096      # 판정에 쓸 기본 컨텍스트 길이
  kv_cache_bytes: 2          # KV 캐시 원소당 바이트 (FP16)
  ram_usable_ratio: 0.8      # 시스템 RAM 중 모델이 쓸 수 있다고 보는 비율, 나머지는 OS·다른 프로그램 몫 (가정값)
  # CPU 오프로딩·CPU 전용 속도 추정에 쓰는 시스템 RAM 대역폭 (GB/s). 가정값: DDR4-3200 듀얼채널
  # = 3200 MT/s × 8바이트 × 2채널 = 51.2 (규격 정의에 따른 계산). 본인 PC 메모리에 맞게 바꿀 것 (DDR5-5600 듀얼 = 89.6)
  system_ram_bandwidth_gbps: 51.2
  stream_chars_per_token: 3  # 속도 체험에서 답변 글자 수를 토큰 수로 바꾸는 근사 (가정값)

# 양자화별 가중치당 비트 수 (bits per weight)
# - Q6_K, Q8_0: llama.cpp ggml/src/ggml-common.h 블록 구조 정의 (2026-10-21 확인)
#     https://raw.githubusercontent.com/ggml-org/llama.cpp/master/ggml/src/ggml-common.h
#     block_q6_K "Effectively 6.5625 bits per weight", block_q8_0 = fp16 scale + 32×int8 = 34바이트/32가중치 = 8.5
# - Q4_K_M, Q5_K_M: 일부 텐서를 더 높은 비트로 두는 혼합 방식이라 구조값(Q4_K 4.5, Q5_K 5.5)보다 크다.
#     공식 Qwen3-4B/8B/14B/32B-GGUF 파일 크기 × 8 ÷ 파라미터 수로 실측 (scripts/measure_bpw.py, 2026-10-21)
#     Q4_K_M 4.826~4.967, Q5_K_M 5.669~5.747 -> "올라가는가" 판정은 보수적이어야 하므로 최댓값을 쓴다
#     (같은 측정에서 Q6_K 6.564~6.576, Q8_0 8.502~8.513으로 구조값과 일치해 측정 방법을 검증)
# - FP16: 가중치당 2바이트
quantization:
  Q4_K_M: 4.97
  Q5_K_M: 5.75
  Q6_K: 6.5625
  Q8_0: 8.5
  FP16: 16
